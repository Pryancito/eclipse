# /etc/hunter/policy.conf — hunter's stance at boot.
#
# Read once by the kernel after /etc/hunter/{whitelist,blacklist}, and applied
# all or nothing: one line that does not parse rejects the whole file, records
# a CRIT event in /proc/hunter and leaves the defaults in place. The same
# directives can be sent to a running system with `hunterctl` (or written to
# /proc/hunter by root). Full reference: docs/hunter-security.md.
#
# Every line below is commented out, so this file changes nothing until you
# uncomment it. Defaults: syscall=enforce, wx=report, exec=report,
# anomaly=report, learning=on.

# --- Enforcement modes: off | report | enforce -------------------------------
# mode syscall enforce
# mode wx report            # enforce breaks JITs (Firefox, JS engines)
# mode exec enforce         # block blacklisted / untrusted / non-allowlisted
# mode anomaly report

# --- Exec allowlist -----------------------------------------------------------
# learning off              # stop trust-on-first-use: unknown programs are
#                           # now denied under `mode exec enforce`
# trust /usr/local/bin/
# deny /usr/bin/nc
# untrusted /run/user/

# --- Behavioural heuristics ---------------------------------------------------
# anomaly-detection on      # flood / fork-bomb counters (costs a lock per syscall)
# privileged-deny on        # with `mode anomaly enforce`: block module/bpf/kexec/ptrace

# --- Seal ---------------------------------------------------------------------
# seal                      # one way: after this nothing can be relaxed until reboot
