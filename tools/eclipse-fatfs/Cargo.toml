[package]
name = "eclipse-fatfs"
version = "0.1.0"
edition = "2021"
description = "Eclipse OS FAT filesystem that runs as a process"

# Standalone: NOT a workspace member. It targets userspace
# (<arch>-unknown-linux-musl), not the zCore bare-metal target, so `xtask`
# builds it on its own (see `xtask/src/linux/udriver.rs`), like the drivers.
[workspace]

[lib]
name = "fatserve"
path = "src/lib.rs"

[[bin]]
name = "eclipse-fatfs"
path = "src/main.rs"

# A test program: what a filesystem is timed with from inside the machine,
# mounted one way and then another.
[[bin]]
name = "eclipse-fs-bench"
path = "src/bin/eclipse-fs-bench.rs"

# The mount helper: what the kernel asks to make a FAT mount that
# `mount(2)` is asked for.
[[bin]]
name = "eclipse-mountd"
path = "src/bin/eclipse-mountd.rs"

[dependencies]
libc = "0.2"
# The system calls and the FIFO.
udrivers = { package = "eclipse-udrivers", path = "../eclipse-udrivers" }
# The FAT code (`vendor/fatfs`): the only FAT there is, as the kernel has
# none of its own.
fatfs = { path = "../../vendor/fatfs", default-features = false, features = ["std", "alloc", "lfn", "log_level_warn"] }

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
# Nothing to unwind into: the kernel answers what this had not with an I/O
# error, and whoever started it starts it again.
panic = "abort"
strip = true
