[package]
name = "eclipse-init"
version = "0.1.0"
edition = "2021"
description = "Eclipse OS init / service supervisor (PID 1)"

# Standalone tool: NOT a workspace member. It targets userspace
# (x86_64-unknown-linux-musl), not the zCore bare-metal target, so it is built
# on its own by `xtask` (see `LinuxRootfs::eclipse_init`).
[workspace]

[[bin]]
name = "eclipse-init"
path = "src/main.rs"

[dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# `unwind`, NOT `abort`: a panic in PID 1 compiled with `abort` is
# instantly "Attempted to kill init" -- a kernel panic, the whole machine,
# for a bug in one decision. With unwinding, `guard` in main.rs catches it,
# says so on the console and keeps supervising. The landing pads cost a few
# KiB of a binary that is already stripped and built for size.
panic = "unwind"
strip = true
