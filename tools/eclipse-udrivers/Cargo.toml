[package]
name = "eclipse-udrivers"
version = "0.1.0"
edition = "2021"
description = "Eclipse OS drivers that run as processes: virtio, NVMe and SATA disks, network cards"

# Standalone: NOT a workspace member. It targets userspace
# (<arch>-unknown-linux-musl), not the zCore bare-metal target, so `xtask`
# builds it on its own (see `xtask/src/linux/udriver.rs`), like eclipse-init.
[workspace]

[lib]
name = "udrivers"
path = "src/lib.rs"

[[bin]]
name = "udrv-virtio-blk"
path = "src/bin/udrv-virtio-blk.rs"

[[bin]]
name = "udrv-ahci"
path = "src/bin/udrv-ahci.rs"

[[bin]]
name = "udrv-nvme"
path = "src/bin/udrv-nvme.rs"

[[bin]]
name = "udrv-virtio-net"
path = "src/bin/udrv-virtio-net.rs"

[[bin]]
name = "udrv-dev-echo"
path = "src/bin/udrv-dev-echo.rs"

[[bin]]
name = "udrv-virtio-input"
path = "src/bin/udrv-virtio-input.rs"

[[bin]]
name = "udrv-ps2"
path = "src/bin/udrv-ps2.rs"

[[bin]]
name = "udrv-hda"
path = "src/bin/udrv-hda.rs"

[[bin]]
name = "udrv-dsp-check"
path = "src/bin/udrv-dsp-check.rs"

[[bin]]
name = "udrv-snd-check"
path = "src/bin/udrv-snd-check.rs"

[[bin]]
name = "udrv-evdev-check"
path = "src/bin/udrv-evdev-check.rs"

[dependencies]
libc = "0.2"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
# A driver that panics has nothing to unwind into: the kernel resets its
# device when the process dies and init starts the next one.
panic = "abort"
strip = true
