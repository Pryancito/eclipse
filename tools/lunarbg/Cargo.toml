[package]
name = "lunarbg"
version = "0.2.0"
edition = "2021"
description = "Eclipse OS native wallpaper client (wlr-layer-shell, procedural night scene)"

# Standalone tool: NOT a workspace member. It targets userspace
# (x86_64-unknown-linux-musl), not the zCore bare-metal target, so it is built
# on its own by `xtask` (see `LinuxRootfs::lunarbg`).
[workspace]

[[bin]]
name = "lunarbg"
path = "src/main.rs"

[dependencies]
libc = "0.2"
# Pure-Rust Wayland stack (no libwayland-client.so needed): the default
# wayland-backend is the Rust implementation, so the binary is fully static.
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[profile.release]
# opt-level 3 (not "z"): the scene renderer is per-pixel float math over the
# whole output; speed matters more than a few KiB of binary here.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
# Symbols + line tables, NOT stripped: these binaries crash on REAL
# HARDWARE where the only artifacts are a kernel line (`pc=0x...`) and a
# photo of the screen. With `strip = true` and no debug info a fault
# address is unsymbolizable -- `addr2line` answers `??` and even `nm` has
# nothing to bracket it with, which is exactly what happened to a lunarbg
# SIGSEGV. Line tables cost disk in the rootfs image and nothing at
# runtime (they are not loaded into memory), so keeping them is the
# right trade for a target with no debugger.
debug = 1
strip = false
