[package]
name = "eclipse-dbusd"
version = "0.1.0"
edition = "2021"
description = "Eclipse OS session message bus (D-Bus daemon)"

# Standalone tool: NOT a workspace member. It targets userspace
# (x86_64-unknown-linux-musl), not the zCore bare-metal target, so it is built
# on its own by `xtask` (see `LinuxRootfs::eclipse_dbusd`).
[workspace]

[lib]
name = "eclipse_dbusd"
path = "src/lib.rs"

[[bin]]
name = "eclipse-dbusd"
path = "src/main.rs"

# The XDG desktop portal backend. Second binary of this package rather than a
# crate of its own: it speaks D-Bus, so it wants `message` and `client`, and a
# separate crate would mean a second marshaller to keep in step with the first.
[[bin]]
name = "eclipse-portald"
path = "src/bin/eclipse-portald.rs"

[dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
