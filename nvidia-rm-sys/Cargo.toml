[package]
name = "nvidia-rm-sys"
version = "0.1.0"
edition = "2018"
description = "FFI bridge to vendored NVIDIA open-gpu-kernel-modules C source (Resource Manager core) for the Eclipse kernel"

[lib]

[features]
# Build the real NVIDIA C into a process (`udrv-nvidia`) instead of the
# kernel: on an x86_64 Linux target, `build.rs` compiles it with the flags
# that are not about ring 0, and the Rust side sees `cfg(nvrm_real)` as the
# kernel build does.
user = []

[dependencies]
log = "0.4"
lock = { git = "https://github.com/DeathWish5/kernel-sync", rev = "8486b8" }

[build-dependencies]
cc = "1"
