# The config file for rboot.
# Place me at \EFI\Boot\rboot.conf

# The address at which the kernel stack is placed.
kernel_stack_address=0xFFFFFF0100000000

# The size of the kernel stack, given in number of 4KiB pages. Defaults to 512.
kernel_stack_size=512

# The virtual address offset from which physical memory is mapped, as described in
# https://os.phil-opp.com/paging-implementation/#map-the-complete-physical-memory
physical_memory_offset=0xFFFF800000000000

# The path of kernel ELF
kernel_path=\EFI\rCore\kernel.elf

# Measured boot (hunter): what rboot hashes with SHA-256 and hands the kernel,
# which compares it against /etc/hunter/boot (`hunterctl boot pin` writes it).
# rboot never refuses to boot over a digest; the kernel decides.
#   kernel  the kernel ELF, this file and the cmdline (default; costs nothing)
#   all     those and the initramfs: hundreds of MB, seconds of boot
#   off     nothing (a pinned input that is not measured is still flagged)
measure=kernel

# The resolution of graphic output.
# `auto` picks the display's EDID-preferred mode (falling back to the largest
# firmware-offered mode at or below 4K). Uncapped "largest mode" is unsafe:
# VirtualBox GOP advertises 8K VRAM-filling modes.
#
# A fixed value is written `WxH` (`1920x1080`; `X` and spaces are accepted too)
# and requests that exact mode. It only works for a mode the firmware actually
# enumerates: if yours is not in the list, rboot keeps the mode the firmware
# already set and logs the list it was offered. A fixed value is also not
# capped, unlike `auto`, so asking for more than 4K is asking the kernel for a
# shadow buffer per console that may not fit its heap.
#
# If a fixed value seems to do nothing, the kernel says why: `dmesg | grep
# '\[gop\]'` prints what was asked, what the firmware offered, whether
# SetMode was refused, and -- on a machine with more than one GPU -- whether
# the card whose mode was set is the one the monitor is plugged into.
resolution=auto

# Kernel Command Line
cmdline=

# The path of initramfs
# initramfs=\EFI\rCore\initramfs.img
