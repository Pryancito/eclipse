[package]
name = "rcore-fs-mountfs"
version = "0.1.0"
authors = ["Runji Wang <wangrunji0408@163.com>"]
edition = "2018"

[dependencies]
log = "0.4"
spin = "0.9"
rcore-fs = { git = "https://github.com/rcore-os/rcore-fs", rev = "1a3246b" }

[features]
std = []

# A backing filesystem for the unit tests. `MountFS` wraps another filesystem
# and does nothing on its own, so there is no way to test it without one, and
# ramfs is the one the kernel actually mounts through it (`/tmp`, `/run`,
# `/dev/shm`).
[dev-dependencies]
rcore-fs-ramfs = { path = "../rcore-fs-ramfs" }
