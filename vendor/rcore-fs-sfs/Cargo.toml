[package]
name = "rcore-fs-sfs"
version = "0.1.0"
authors = ["WangRunji <wangrunji0408@163.com>"]
edition = "2018"

[dependencies]
rcore-fs = { git = "https://github.com/rcore-os/rcore-fs", rev = "1a3246b" }
static_assertions = "1.1"
spin = "0.9"
log = "0.4"
bitvec = { version = "0.22", default-features = false, features = ["alloc"] }

[dev-dependencies]
tempfile = "3.2"

[features]
# `lib.rs` tests `feature = "std"` for its `no_std` gate; declare it so the
# path-patched crate does not raise `unexpected_cfgs` on every build.
#
# Forwarded to `rcore-fs` so that `cargo test -p rcore-fs-sfs --features std`
# gets the `Device` impl for `Mutex<File>` that every test in `tests.rs`
# builds its filesystem on. Without it the test target does not compile at
# all, which is how this crate's suite went unrun.
std = ["rcore-fs/std"]
