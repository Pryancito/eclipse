name: Test CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  rust_toolchain: nightly-2026-09-01

permissions:
  contents: read

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.rust_toolchain }}
          components: rust-src, llvm-tools-preview

      - name: Run unit test
        run: |
          python3 -m unittest discover -s scripts/tests
          cargo test --no-fail-fast
          # `elf` too: `util::elf_loader` is behind that feature, so without
          # it this line compiles neither the 1112 lines that parse every
          # binary the system executes nor their tests. They ran only as
          # part of the workspace pass above, where feature unification
          # turns `elf` on because `linux-object` asks for it.
          cargo test -p zircon-object --lib --features libos,aspace-separate,elf
          cargo test -p zircon-syscall --features libos,zircon-object/aspace-separate
          # The kernel links `vendor/PreemptiveScheduler` (`[patch]` →
          # `executor`). The old pristine `vendor/preemptive-scheduler` copy
          # was merged away; this is the only tree. Single-threaded because
          # the cross-CPU tests drive process-wide masks (EXECUTOR_READY,
          # SLEEPING_CPUS, NEED_RESCHED).
          cargo test --manifest-path vendor/PreemptiveScheduler/Cargo.toml --tests -- --test-threads=1
          # `vendor/kernel-sync` is the `lock` crate: every mutex, rwlock and
          # per-CPU interrupt-disable counter the kernel has. It had no line
          # here and no tests, and it could not have had any -- the whole
          # implementation was behind `cfg(target_os = "none")`, so a host
          # build compiled nothing but no-op shims. A `cargo test` build now
          # compiles the real thing against a host interrupt backend.
          cargo test -p lock --lib -- --test-threads=1
          # `vendor/trapframe` is the other `[patch]`ed vendor crate, and the
          # one the kernel cannot take a single trap without: the GDT, the TSS,
          # the IDT, the syscall MSRs and the entry stubs that build a
          # `UserContext` on the stack. It is in the workspace `exclude`, so
          # the bare `cargo test` above does not reach it, and the only line in
          # this file that did name it -- "Verify native AArch64 fncall ABI",
          # far below -- is gated on `matrix.arch == 'aarch64'`. On x86_64 that
          # step is skipped, and x86_64 is the architecture this kernel boots
          # on: its whole arch module, and the `UserContext` layout the entry
          # assembly addresses by hardcoded slot number, were tested by
          # nothing. Only `fncall.rs` and the structs compile for a host
          # target; pinning that layout is what `layout_tests` does.
          cargo test --manifest-path vendor/trapframe/Cargo.toml
          # `default-members = ["xtask"]` in the workspace manifest means the
          # bare `cargo test` above builds ONLY xtask, so these two crates'
          # unit tests -- the DRM/KMS present path, the NVIDIA decode helpers,
          # the syncobj table, the e1000e rings -- never ran here at all.
          # Named explicitly, and single-threaded because several of them drive
          # process-wide driver state (DRM_STATE, the CE staging buffer).
          # `--features graphic` is not optional: the graphic console, its
          # shadow framebuffer and their tests are all behind it, and without
          # it they are filtered out silently -- a green run that checked
          # nothing.
          # `virtio` is not optional either, and for a harder reason: it is
          # the disk, the GPU, the console and the input devices of every QEMU
          # boot -- every baremetal job in this file runs on them -- and with
          # the feature off, `drivers/src/virtio/` (696 lines) was not compiled
          # by anything, here or in `make clippy`.
          # `xhci-usb-hid` gates `drivers/src/usb/` -- 4700 lines with 24 tests
          # in them, written for the two `capability()` bugs behind "el raton ha
          # dejado de funcionar" and "la rueda no va" -- and this line is the
          # only place that could have run them. It did not: a module behind a
          # `cfg(feature)` is compiled by nothing, so those tests had never run
          # once. The feature also needs x86_64, which is what this job is.
          cargo test -p zcore-drivers --lib --features graphic,virtio,xhci-usb-hid -- --test-threads=1
          # `mock-disk` gates `linux-object/src/fs/mock.rs`, the RAM-backed
          # disk that `make MOCK=1` makes the ROOT filesystem device. The
          # feature is set from that one make variable and no job here passes
          # it, so the file was compiled by nothing at all -- not this job, not
          # `make clippy`. It had drifted far enough that
          # `cargo clippy --features mock-disk` did not even build the crate:
          # one `clippy::deref_addrof`, and `linux-object` denies warnings.
          # Named here rather than on a second line because the feature only
          # adds a module: this run covers everything the bare one did, and
          # every other job in the file builds the crate without it.
          cargo test -p linux-object --lib --features mock-disk -- --test-threads=1
          # The reference benchmarks (`benches/`). COMPILED, not run: a
          # benchmark takes tens of seconds per row and its figures are
          # meaningless on a shared runner, but a bench target that nothing
          # builds rots silently and is then a day's archaeology on the
          # morning somebody needs a before/after. `--no-run` costs seconds
          # and keeps them honest. Run them for real with
          # `cargo bench -p <crate> --bench <name> --features <...>`.
          cargo bench -p linux-object --bench vfs --features mock-disk --no-run
          cargo bench -p linux-object --bench signal --features mock-disk --no-run
          cargo bench -p zircon-object --bench vm --features libos,aspace-separate --no-run
          cargo bench -p zircon-object --bench futex --features libos,aspace-separate --no-run
          # `linux-syscall`'s benches are not a `benches/` target: every
          # submodule of that crate is private, so they live in `#[cfg(test)]`
          # modules beside the syscalls and build with the lib.
          cargo bench -p linux-syscall --no-run
          # Three more crates whose unit tests `default-members` hid the same
          # way: the syscall entry points, the HAL (user-pointer copies, CPU
          # stats) and the anomaly detector.
          cargo test -p linux-syscall --lib -- --test-threads=1
          cargo test -p kernel-hal --lib -- --test-threads=1
          cargo test -p hunter --lib -- --test-threads=1
          # The OS side of the vendored NVIDIA RM: 6500 lines of the interface
          # the RM calls into, in the workspace but named by no job here, so
          # nothing it answers had ever been executed anywhere but on a real
          # GPU. Builds on the host without the submodule (build.rs skips the
          # NVIDIA C and says so).
          # Not `--lib`: `src/srcs_mk.rs` -- which decides WHICH of NVIDIA's
          # 1012 C files get compiled, and which two are replaced by Eclipse's
          # patched copies -- is reached through `tests/srcs_mk.rs`, because
          # `build.rs` is not a target any `cargo test` compiles and its own
          # checks would otherwise run nowhere. Same shape as linux-vdso below.
          cargo test -p nvidia-rm-sys -- --test-threads=1
          # The VFS trait under every file system: the path walk that follows
          # symlinks (`INode::lookup_follow`). Reached only through `[patch]`,
          # so its tests had never run anywhere.
          cargo test -p rcore-fs --features std
          # The btrfs driver is a path dependency of linux-object, so
          # `default-members` hid its ~50 tests here too -- including the ones
          # that cross-validate our images against btrfs-progs (those skip
          # themselves when `btrfs` is not installed). `--features std` is
          # what gives them a file-backed block device; release because the
          # allocator/B-tree scaling tests take ~82s unoptimised against ~28s
          # optimised, and they are the bulk of the suite.
          cargo test --release -p btrfs --features std
          # The SFS the initramfs root lives on. Its suite is in the tree but
          # had never run here: the crate is only reached through `[patch]`,
          # and `--features std` is what gives its tests a file-backed device
          # (without it the test target does not even compile).
          cargo test -p rcore-fs-sfs --features std
          # The three filesystems the kernel mounts over everything else, and
          # none of them had a line here or a single test. `mountfs` is what
          # every path in the system is resolved through; `ramfs` is /tmp, /run
          # and /dev/shm; `devfs` is /dev. 1400 lines that no job compiled as a
          # test target: they are reached only through `[patch]`, and the bare
          # `cargo test` above builds `default-members` alone.
          cargo test -p rcore-fs-mountfs --lib
          cargo test -p rcore-fs-ramfs --lib
          cargo test -p rcore-fs-devfs --lib
          # And the crate underneath all of them: the `INode` trait, the path
          # walk every `open(2)` goes through, and the block layer the root
          # filesystem reads the disk with -- the LRU buffer cache included.
          # It did have three tests, and they had never run either: `mod std`
          # is gated on `any(test, feature = "std")` but its `libc` dependency
          # only arrived with the feature, so the test target did not compile.
          cargo test -p rcore-fs --lib
          # The virtio drivers themselves: the virtqueue every one of those
          # devices talks through. The tree vendored them and then built the
          # git revision anyway -- there was no `[patch]` for this one -- so
          # `vendor/virtio-drivers` was a copy nothing compiled, let alone
          # tested. The suite stands a device up out of ordinary memory: the
          # header is a `#[repr(C)]` register map and the four `virtio_*`
          # symbols are answered from a bump arena, so a read of a sector goes
          # through the real ring and comes back.
          cargo test -p virtio-drivers --lib -- --test-threads=1
          # The allocator that decides where every PCI BAR window lands: the
          # 32-bit MMIO, 64-bit MMIO, prefetchable and port-I/O free lists of
          # every upstream node. It sat in the workspace `exclude` list while
          # being a path dependency of `zircon-object`, so every kernel build
          # compiled it and no `cargo test`, `cargo fmt` or `cargo clippy` line
          # in the tree named it.
          cargo test -p region-alloc --lib -- --test-threads=1
          # The TCP/IP stack itself. `smoltcp/` is this tree's copy and the
          # root `[patch]` points every crate at it, so it is the stack the
          # kernel actually runs -- and it is in the workspace `exclude` list
          # with no `cargo` line in the tree naming it, so its 427 tests had
          # never run once. They did not even build: a `pub use` in
          # `socket/icmp.rs`'s test helpers had gone unused, and the crate
          # denies `unused` whenever a proto feature is on. Default features on
          # purpose -- that is what upstream tests -- and nothing in the suite
          # opens a raw socket, so it needs no privileges.
          cargo test --manifest-path smoltcp/Cargo.toml
          # The text console the kernel prints through, escape sequences and
          # all. This one was unreachable for a reason: three SDL2 example
          # programs pulled in `embedded-graphics-simulator`, whose `sdl2-sys`
          # collides with the one `zcore-drivers` already links, so cargo
          # refused the crate as a workspace member at all. The demos now sit
          # out of the build graph (`autoexamples = false`) and the console
          # itself is tested over a `Vec` standing in for the frame buffer.
          #
          # `--no-default-features` on purpose: that turns the `log` feature off,
          # which is how the kernel takes this crate (`zcore-drivers` asks for it
          # with `default-features = false`), and it swaps the real `log` macros
          # for the dummy ones in `src/log.rs`. Those accept a narrower shape of
          # argument, so a `trace!` that compiles with the feature on can still
          # fail to build the kernel. This line builds what the kernel builds.
          cargo test -p rcore-console --lib --no-default-features -- --test-threads=1
          # The loader -- the code around user mode: the signal frame a
          # handler returns from, the CPU-exception-to-signal table. Its
          # default features pull in `zircon`, whose `include_bytes!` of the
          # prebuilt userboot blobs is not in a plain checkout, so the test
          # target is built for the Linux personality alone.
          cargo test -p zcore-loader --lib --no-default-features --features linux,libos
          # The vDSO. `default-members` hid this one too, and nothing else in
          # the tree builds it as a test target, so neither the symbol lookup
          # nor the tests that map the linked image and *call* it had ever run
          # here. Not `--lib`: the integration test is the half that executes
          # the image, and it is where a wrong fixed-point multiply or a path
          # returning -EINVAL instead of -ENOSYS shows up.
          cargo test -p linux-vdso
          # rboot, the UEFI bootloader. It is `exclude`d from the workspace
          # (its own toolchain file and its own target), so nothing in CI ever
          # built it, let alone tested it -- and it is the first code that
          # runs on the machine. Its default features pull in `uefi-services`,
          # whose panic handler collides with `std`'s `panic_impl` lang item
          # in a test binary, so the library target is built without them;
          # that still covers everything that does not talk to the firmware:
          # `rboot.conf` parsing, the kernel cmdline, EDID and graphic-mode
          # choice, and the splash and progress bar drawn into plain memory.
          cargo test --manifest-path rboot/Cargo.toml --lib --no-default-features
          # eclipse-init, PID 1 of the installed system. Same hole rboot was in
          # and worse: it is a standalone package (its own `[workspace]` table,
          # its own musl target) that `xtask` builds BEST-EFFORT, so a break
          # here does not fail a build -- it silently leaves busybox init as
          # PID 1 and the desktop never starts. Nothing in this file compiled
          # it. What the tests cover is every decision it makes before it
          # touches the kernel: the `:`-joined boot arguments, which session
          # boots, the locale and timezone precedence, the service-file parser,
          # the `after =` start order, and the renderer policy -- the last of
          # which is written twice more, in `/etc/profile` and the labwc
          # wrapper, and is cross-checked against those two in `xtask`.
          cargo test --manifest-path tools/eclipse-init/Cargo.toml
          # lunarbg, the desktop wallpaper: the same standalone-package hole as
          # eclipse-init (its own `[workspace]`, its own musl target, built
          # best-effort by `xtask`, which on failure only prints "swaybg
          # fallback remains"). Nothing in this file compiled it either. It is
          # a software renderer that paints every pixel of every output and
          # then hands the compositor shm buffers, so what the tests cover is
          # the arithmetic that has to be right for the wallpaper to appear at
          # all: the two buffer ceilings and the HiDPI scale walked down to fit
          # them, the shm pool geometry the seed and the animation must agree
          # on, the damage rect in surface coordinates, the animated region
          # staying inside the buffer, and the pixel helpers discarding a
          # coordinate instead of writing it one row down.
          cargo test --manifest-path tools/lunarbg/Cargo.toml
          # lunarbar, the desktop panel (and lunarrun, the Alt+Space runner):
          # the third standalone package in `tools/` that no cargo line named.
          # `--lib` is not enough here -- the panel and the runner are two
          # `[[bin]]`s over a shared lib -- so the bare form runs all three
          # targets. What the tests cover is the data layer the bar draws from:
          # every /proc reader (stat, meminfo, net/dev, uptime, loadavg), the
          # thermal and battery files, the byte-rate formatter, and the
          # calendar the clock pill opens.
          cargo test --manifest-path tools/lunarbar/Cargo.toml
          # eclipse-dbusd, the session message bus: the LAST standalone package
          # in `tools/` that no cargo line named, and the one where it cost the
          # most -- it already had 34 tests and not one of them had ever run in
          # CI. `xtask` builds it best-effort too ("only dbus-daemon can serve
          # the bus" on failure), and on an image with no package mirror within
          # reach there is no dbus-daemon, so a break here is a session bus that
          # is simply absent and every GTK, Qt and SDL client that needs one
          # exits before drawing. What the tests cover is the wire format and
          # the routing: the header and field-array marshalling in both byte
          # orders, the match-rule parser and what each rule selects, name
          # ownership with its replacement queue, and the client handshake
          # against a daemon started on a real socket in the same process.
          cargo test --manifest-path tools/eclipse-dbusd/Cargo.toml
          # The kernel binary crate itself. Its `[[bin]]` section carried
          # `test = false`, so no job in this file ever compiled it as a test
          # target -- the same hole rboot was in, in the crate that owns the
          # dmesg ring, the physical frame allocator and the exit status this
          # very job reads. Built for the libos personality, which is the one
          # that links against the host.
          # `linux` as well as `libos`: the Linux personality is what this
          # kernel actually boots, and with it the victim exit code in `oops`
          # can be checked against `linux-object`'s own spelling of it instead
          # of only against a literal.
          cargo test -p zcore --features libos,linux -- --test-threads=1

      - name: Build the bootloader for its real target
        run: |
          # Nothing else here compiles rboot, so a change that only breaks the
          # UEFI build (an `x86_64-unknown-uefi`-only path, a dependency bump)
          # reaches the ESP unnoticed. Same flags as `rboot/Makefile`.
          cargo build --manifest-path rboot/Cargo.toml \
            --target x86_64-unknown-uefi \
            -Z build-std=core,alloc \
            -Z build-std-features=compiler-builtins-mem

  zircon-core-test-libos:
    name: Zircon Core Test Libos (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64 Linux
            os: ubuntu-latest
            arch: x86_64
            uname: x86_64
          - name: aarch64 Linux
            os: ubuntu-24.04-arm
            arch: aarch64
            uname: aarch64
          - name: aarch64 macOS
            os: macos-15
            arch: aarch64
            uname: arm64
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: 'recursive'

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.rust_toolchain }}
          components: rust-src, llvm-tools-preview

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Verify native architecture
        run: test "$(uname -m)" = "${{ matrix.uname }}"

      - name: Install wget on macOS
        if: runner.os == 'macOS'
        run: brew install wget

      - name: Pull prebuilt images
        run: make zircon-init

      - name: Install python dependencies
        run: python3 -m pip install -r tests/requirements.txt

      - name: Verify native AArch64 fncall ABI
        # Linux only: vendor/trapframe gates its aarch64 fncall module on
        # `target_os = "linux"` (src/arch/aarch64/mod.rs), so on Darwin the
        # module exports nothing and this test cannot compile, let alone run.
        if: matrix.arch == 'aarch64' && runner.os != 'macOS'
        run: |
          mkdir -p target
          cargo metadata --format-version 1 > target/cargo-metadata.json
          trapframe_manifest=$(python3 -c 'import json; print(next(p["manifest_path"] for p in json.load(open("target/cargo-metadata.json"))["packages"] if p["name"] == "trapframe"))')
          # No --features here: `fncall-preserve-x18` is an upstream trapframe
          # flag, and vendor/trapframe (this tree's fork) has neither the
          # feature nor a need for it -- its aarch64 fncall path preserves x18
          # unconditionally, and the round-trip test in
          # src/arch/aarch64/fncall.rs asserts it like every other register.
          # Asking for the feature failed the step in under a second with
          # "the package 'trapframe' does not contain this feature".
          cargo test --manifest-path "$trapframe_manifest" --release

      - name: Report macOS LibOS skip
        # Two independent blockers, neither of them a regression to chase:
        # this tree has no Darwin port of trapframe's aarch64 fncall path, so
        # the LibOS kernel does not link; and even linked, Darwin clears guest
        # x18 on host exception return and GitHub macOS runners reject the
        # private custom-x18-abi entitlement (CI 34018139132), so Fuchsia
        # shadow-call-stack guests cannot start. Attempting the build only
        # spent runner minutes to fail the same way every run.
        if: runner.os == 'macOS'
        run: |
          mkdir -p target/test-logs/zircon-aarch64-libos
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          reason = "No Darwin port of trapframe's aarch64 fncall path, so the LibOS kernel does not link. Even linked, Darwin clears guest x18 on host exception return and GitHub macOS runners reject the required private custom-x18-abi entitlement (CI 34018139132), so Fuchsia shadow-call-stack guests cannot start."
          Path("target/test-logs/zircon-aarch64-libos/results.json").write_text(json.dumps({"status": "SKIPPED", "reason": reason, "runs": []}, indent=2) + "\n")
          print("::warning::SKIP macOS LibOS: " + reason)
          PYTHON

      - name: Run fast tests
        if: github.event_name != 'workflow_dispatch' && runner.os != 'macOS'
        run: python3 scripts/zircon_core_test.py --arch ${{ matrix.arch }} --libos --fast

      - name: Run full tests
        if: github.event_name == 'workflow_dispatch' && runner.os != 'macOS'
        run: python3 scripts/zircon_core_test.py --arch ${{ matrix.arch }} --libos

      - name: Upload guest and kernel logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zircon-core-test-libos-${{ matrix.arch }}-${{ runner.os }}
          path: |
            target/test-logs/
            target/kernel-*.log
            tests/*.log
            tests/kernel.log
          if-no-files-found: warn

  zircon-core-test:
    name: Zircon Core Test Baremetal (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            qemu_package: qemu-system-x86
            qemu_binary: qemu-system-x86_64
          - arch: aarch64
            qemu_package: qemu-system-arm
            qemu_binary: qemu-system-aarch64
          - arch: riscv64
            qemu_package: qemu-system-misc
            qemu_binary: qemu-system-riscv64
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: 'recursive'

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.rust_toolchain }}
          components: rust-src, llvm-tools-preview

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Pull prebuilt images
        run: make zircon-init

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.qemu_package }}
          ${{ matrix.qemu_binary }} --version

      - name: Install cargo-binutils
        if: matrix.arch == 'riscv64'
        run: cargo install cargo-binutils --locked

      - name: Install python dependencies
        run: python3 -m pip install -r tests/requirements.txt

      - name: Run x64 SMP port stress regressions
        if: matrix.arch == 'x86_64'
        run: |
          python3 scripts/zircon_core_test.py --arch x86_64 --smp 2 --log-dir target/test-logs/port-smp2 --x64-cpu 'Haswell,+smap,-check,+fsgsbase,-x2apic' --group port-stress
          python3 scripts/zircon_core_test.py --arch x86_64 --smp 4 --log-dir target/test-logs/port-smp4 --group port-stress

      - name: Report baremetal aarch64 skip
        # Not a test failure: the configuration was never plumbed. `justrun`
        # for ARCH=aarch64 wants ignored/target/aarch64/firmware/QEMU_EFI.fd,
        # a disk/EFI/Boot/Boot.json to rewrite the cmdline into, and an
        # aarch64.img data drive (see zCore/Makefile). Those come from
        # `cargo image`, which the Zircon path does not run, and there is no
        # ZBI handoff on this platform either. QEMU therefore never started,
        # and the job failed with no guest output at all.
        if: matrix.arch == 'aarch64'
        run: |
          mkdir -p target/test-logs/zircon-aarch64-bare
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          reason = "Baremetal aarch64 Zircon is not plumbed: no UEFI firmware, no ESP Boot.json and no ZBI handoff outside `cargo image`, so QEMU cannot be started."
          Path("target/test-logs/zircon-aarch64-bare/results.json").write_text(json.dumps({"status": "SKIPPED", "reason": reason, "runs": []}, indent=2) + "\n")
          print("::warning::SKIP baremetal aarch64 Zircon: " + reason)
          PYTHON

      - name: Run fast tests
        if: github.event_name != 'workflow_dispatch' && matrix.arch != 'aarch64'
        run: python3 scripts/zircon_core_test.py --arch ${{ matrix.arch }} --fast

      - name: Run full tests
        if: github.event_name == 'workflow_dispatch' && matrix.arch != 'aarch64'
        run: python3 scripts/zircon_core_test.py --arch ${{ matrix.arch }}

      - name: Upload guest and kernel logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zircon-core-test-${{ matrix.arch }}
          path: |
            target/test-logs/
            target/kernel-*.log
            tests/*.log
            tests/kernel.log
          if-no-files-found: warn

  linux-libc-test-libos:
    name: Linux Libc Test Libos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: 'recursive'

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.rust_toolchain }}
          components: rust-src, llvm-tools-preview

      - name: Prepare rootfs
        run: cargo xtask libos-libc-test

      - name: Install python dependencies
        run: pip3 install -r tests/requirements.txt

      - name: Run fast tests
        if: github.event_name != 'workflow_dispatch'
        run: python3 scripts/linux_libc_test.py --libos --fast

      - name: Run full tests
        if: github.event_name == 'workflow_dispatch'
        run: python3 scripts/linux_libc_test.py --libos

      - name: Upload guest and kernel logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-libc-test-libos-x86_64
          path: |
            target/test-logs/
            target/kernel-*.log
            tests/*.log
            tests/kernel.log
          if-no-files-found: warn

  linux-libc-test-baremetal:
    name: Linux Libc Test Baremetal
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, riscv64, aarch64]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: 'recursive'

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.rust_toolchain }}
          components: rust-src, llvm-tools-preview

      - name: Install QEMU and image tools
        run: |
          sudo apt-get update
          # mtools/dosfstools assemble the EFI image that `cargo image` builds
          # for x86_64; the runner has mkfs.vfat but not mmd/mcopy.
          sudo apt-get install -y qemu-system mtools dosfstools
          qemu-system-${{ matrix.arch }} --version

      # Estos jobs prueban libc y busybox, no el escritorio, y fuera de x86_64
      # la imagen que arranca QEMU es el rootfs ENTERO (`image()` la dimensiona
      # con `sfs_size_for(sfs_payload_bytes(rootfs))`; x86_64 fotografia un root
      # minimo antes y manda Mesa a `rootfs.btrfs.gz`). Desde que el #1758 dejo
      # de saltarse `xorg::install` por arco, los 77 paquetes de
      # Mesa/Firefox/XFCE entraban en esa imagen:
      #   - riscv64 arranca con `-initrd ... -m 1G`, asi que a 1,32 GiB QEMU no
      #     encendia la CPU («Some ROM regions are overlapping», estado 2);
      #   - aarch64 si arranca (virtio-blk), pero `busybox du` recorre el arbol
      #     entero y paso de 9 s a TIMEOUT.
      # Apagarlo aqui devuelve a estos jobs el contenido que tenian antes del
      # #1758 y les ahorra bajar el cierre. La variante desktop de verdad lo
      # sigue llevando: la construye `make release`, no esto.
      - name: Prepare rootfs
        env:
          ECLIPSE_XORG: ${{ matrix.arch == 'x86_64' && 'on' || 'off' }}
        run: cargo libc-test --arch ${{ matrix.arch }} && cargo image --arch ${{ matrix.arch }}

      - name: Install cargo-binutils
        if: matrix.arch == 'riscv64'
        run: cargo install cargo-binutils --locked

      - name: Install python dependencies
        run: pip3 install -r tests/requirements.txt

      - name: Run fast tests
        if: github.event_name != 'workflow_dispatch'
        run: python3 scripts/linux_libc_test.py --arch ${{ matrix.arch }} --fast

      - name: Run full tests
        if: github.event_name == 'workflow_dispatch'
        run: python3 scripts/linux_libc_test.py --arch ${{ matrix.arch }}

      - name: Upload guest and kernel logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-libc-test-baremetal-${{ matrix.arch }}
          path: |
            target/test-logs/
            target/kernel-*.log
            tests/*.log
            tests/kernel.log
          if-no-files-found: warn

