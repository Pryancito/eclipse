# Keeps a running total of repository clones for the README badge.
#
# GitHub's traffic API only returns the last 14 days and needs a token with
# "Administration: read" on the repository (the default GITHUB_TOKEN cannot
# read it). This job runs daily, merges the last 14 days into a per-day history
# and publishes a shields.io endpoint file on the `badges` branch:
#
#   https://img.shields.io/endpoint?url=https://raw.githubusercontent.com/Pryancito/eclipse/badges/clones.json
#
# Setup: create a fine-grained personal access token for this repository with
# "Administration: Read-only" and save it as the TRAFFIC_TOKEN secret.
name: clones badge

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clones-badge
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the badges branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Switch to the badges branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin badges; then
            git switch -C badges FETCH_HEAD
          else
            git switch --orphan badges
            git rm -rf --quiet . || true
          fi

      - name: Fetch clone traffic
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          if [ -z "$TRAFFIC_TOKEN" ]; then
            echo "::error::Missing TRAFFIC_TOKEN secret (fine-grained token with Administration: Read-only)."
            exit 1
          fi
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TRAFFIC_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/traffic/clones" \
            -o "$RUNNER_TEMP/clones.json"

      - name: Merge history and write the badge
        run: |
          python3 - "$RUNNER_TEMP/clones.json" <<'EOF'
          import json, os, sys
          recent = json.load(open(sys.argv[1]))
          hist_path = "clones-history.json"
          hist = json.load(open(hist_path)) if os.path.exists(hist_path) else {}
          # The API reports each day in full once it has ended; a later run
          # may see a bigger count for the same day, so keep the maximum.
          for day in recent.get("clones", []):
              key = day["timestamp"][:10]
              old = hist.get(key, {"count": 0, "uniques": 0})
              hist[key] = {
                  "count": max(old["count"], day["count"]),
                  "uniques": max(old["uniques"], day["uniques"]),
              }
          hist = dict(sorted(hist.items()))
          json.dump(hist, open(hist_path, "w"), indent=1)
          total = sum(d["count"] for d in hist.values())
          json.dump(
              {"schemaVersion": 1, "label": "clones", "message": str(total), "color": "blue"},
              open("clones.json", "w"),
          )
          print(f"total clones since tracking started: {total}")
          EOF

      - name: Publish
        run: |
          git add clones.json clones-history.json
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git commit -m "clones badge: update $(date -u +%F)"
          git push origin badges
