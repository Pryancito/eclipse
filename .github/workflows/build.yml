name: Build CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  rust_toolchain: nightly-2026-09-01

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.rust_toolchain }}
          components: rust-src, rustfmt, clippy

      - name: Check format
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --all-features

      - name: Clippy
        run: cargo clippy --all-features

      - name: Pull prebuilt images
        if: github.event_name == 'workflow_dispatch'
        run: make zircon-init

      - name: Build docs
        if: github.event_name == 'workflow_dispatch'
        run: cargo doc --no-deps --all-features --workspace

  test-libos:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [linux]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.rust_toolchain }}
          components: rust-src, llvm-tools-preview, clippy

      - name: Build
        run: cargo build --package zcore --features "${{ matrix.mode }} libos"

      - name: Clippy
        run: cargo clippy --package zcore --features "${{ matrix.mode }} libos"

  test-bare-metal:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, riscv64, aarch64]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: 'recursive'

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.rust_toolchain }}
          components: rust-src, llvm-tools-preview, clippy

      - name: Install cargo-binutils
        run: cargo install cargo-binutils --locked

      - name: Install qemu-utils
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y qemu-utils

      - name: Pull prebuilt images
        run: make zircon-init

      - name: Build ${{ matrix.arch }} bare-metal zircon
        run: cd zCore && make build  ARCH=${{ matrix.arch }} ZBI=core-tests

      - name: Clippy ${{ matrix.arch }} bare-metal zircon
        run: cd zCore && make clippy ARCH=${{ matrix.arch }} ZBI=core-tests

      - name: Xtask Build bare-metal linux
        run: cargo bin -m virt-${{ matrix.arch }}

  # The memory-debugging build, in a job of its own.
  #
  # `MEM_DEBUG=1` turns on the redzone canary after every allocation, the
  # poison on free and the frame bitset that reports a double alloc. It is the
  # one tool in the tree that catches a corruption AT THE WRITE instead of ten
  # minutes later, and it sat here unreachable: no switch in the Makefile, no
  # job compiling it, and when it was finally asked for it did not compile at
  # all (18 `never used` errors, because the `slab` that uses those lists is
  # switched off by this very feature).
  #
  # Hence this job. A feature nothing compiles rots again within a week, and
  # then the next corruption is found the way the last three were: by reading
  # a photograph of a blue screen.
  mem-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: 'recursive'

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.rust_toolchain }}
          components: rust-src, llvm-tools-preview, clippy

      - name: Install cargo-binutils
        run: cargo install cargo-binutils --locked

      - name: Pull prebuilt images
        run: make zircon-init

      - name: Build x86_64 with MEM_DEBUG=1
        run: cd zCore && make build ARCH=x86_64 MEM_DEBUG=1

      - name: Clippy x86_64 with MEM_DEBUG=1
        run: cd zCore && make clippy ARCH=x86_64 MEM_DEBUG=1

  # La ISO que se distribuye, construida y ARRANCADA.
  #
  # El hueco que tapa: `make release` saca `dist/eclipse-<variante>-<arco>.iso`
  # y nada la tocaba despues. Los jobs de `Test CI` construyen la rootfs y
  # arrancan `cargo image`, pero la ISO de UEFI --- con su ESP, su El Torito y
  # sus payloads --- no la montaba nadie, y es justo la que se le da a alguien.
  # Los tres fallos que la dejaron inservible en arm64 (las herramientas de
  # `tools/` enlazadas con el `ld` del host, `/etc/apk/arch` sin escribir, las
  # claves de firma sin ir por arco) no los caza compilar: el primero salia como
  # un `warning:` y una imagen con busybox de PID 1.
  #
  # `cargo image` ya verifica la rootfs antes de empaquetarla
  # (`xtask/src/linux/verify.rs`), y eso cubre lo que se puede mirar sin
  # encender nada. Esto es la otra mitad: que la ISO arranque de verdad y que
  # PID 1 sea eclipse-init, que es lo que busybox no dice.
  #
  # Solo minimal/x86_64: es la unica arquitectura con ISO de UEFI y la variante
  # mas corta de construir. Una matriz entera aqui cuesta cuatro veces mas
  # tiempo de runner para vigilar el mismo andamio.
  iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: 'recursive'

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.rust_toolchain }}
          components: rust-src, llvm-tools-preview

      - name: Install cargo-binutils
        run: cargo install cargo-binutils --locked

      # mkfs.vfat/mtools montan el ESP de la ISO y xorriso la cierra; QEMU la
      # arranca. El firmware UEFI ya viene en el arbol (`rboot/OVMF.fd`), asi
      # que no hay que instalar OVMF.
      - name: Install ISO and QEMU tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y dosfstools mtools xorriso qemu-system-x86

      - name: Pull prebuilt images
        run: make zircon-init

      - name: Build the minimal x86_64 ISO
        run: make release ARCHS=x86_64 VARIANTS=minimal

      - name: Boot it
        run: scripts/iso-smoke.sh -a x86_64 -v minimal

      - name: Upload the guest console log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iso-smoke-console
          path: build/iso-smoke.log
          if-no-files-found: warn

  build-user:
    # The unpatched runtime prebuilts do not contain a Fuchsia C/C++ SDK sysroot.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install prebuilt images
        run: make zircon-init

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.rust_toolchain }}
          targets: x86_64-unknown-fuchsia

      - name: Build Zircon user programs
        run: cd zircon-user && make build MODE=release
