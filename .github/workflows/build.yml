name: Build CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# One run per PR (or per branch on push): a new push cancels the superseded run
# instead of queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  rust_toolchain: nightly-2026-09-01

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.rust_toolchain }}
          components: rust-src, rustfmt, clippy

      - name: Check format
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --all-features

      - name: Clippy
        run: cargo clippy --all-features

      - name: Pull prebuilt images
        if: github.event_name == 'workflow_dispatch'
        run: make zircon-init

      - name: Build docs
        if: github.event_name == 'workflow_dispatch'
        run: cargo doc --no-deps --all-features --workspace

  test-libos:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [linux, zircon]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.rust_toolchain }}
          components: rust-src, llvm-tools-preview, clippy

      - name: Pull prebuilt images
        if: matrix.mode == 'zircon'
        run: make zircon-init

      - name: Build
        run: cargo build --package zcore --features "${{ matrix.mode }} libos"

      - name: Clippy
        run: cargo clippy --package zcore --features "${{ matrix.mode }} libos"

  test-bare-metal:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, riscv64, aarch64]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: 'recursive'

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.rust_toolchain }}
          components: rust-src, llvm-tools-preview, clippy

      - name: Install cargo-binutils
        run: cargo install cargo-binutils --locked

      - name: Install qemu-utils
        run: sudo apt-get update && sudo apt-get install -y qemu-utils

      - name: Pull prebuilt images
        if: matrix.arch == 'x86_64'
        run: make zircon-init

      - name: Build ${{ matrix.arch }} bare-metal zircon
        if: matrix.arch == 'x86_64'
        run: cd zCore && make build  ARCH=${{ matrix.arch }} ZBI=core-tests

      - name: Clippy ${{ matrix.arch }} bare-metal zircon
        if: matrix.arch == 'x86_64'
        run: cd zCore && make clippy ARCH=${{ matrix.arch }} ZBI=core-tests

      - name: Build ${{ matrix.arch }} bare-metal linux
        if: matrix.arch != 'x86_64'
        run: cd zCore && make build  ARCH=${{ matrix.arch }} LINUX=1

      - name: Clippy ${{ matrix.arch }} bare-metal linux
        run: cd zCore && make clippy ARCH=${{ matrix.arch }} LINUX=1

      - name: Xtask Build bare-metal linux
        run: cargo bin -m virt-${{ matrix.arch }}

  build-user:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install prebuilt images
        run: make zircon-init

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.rust_toolchain }}
          targets: x86_64-unknown-fuchsia

      - name: Build Zircon user programs
        run: cd zircon-user && make build MODE=release
